# Search
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
workspaces = true

# UX
style = "compact"
enter_accept = true
show_preview = true

[keys]
scroll_exits = false

[history]
secrets_filter = true

[sync]
auto_sync = false

[updates]
check = false

[logs]
dir = "~/.local/state/atuin/logs"
