theme = "tokyonight_storm"

[editor]
auto-format = true
bufferline = "multiple"
line-number = "relative"
shell = ["zsh", "-c"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = true

[editor.lsp]
display-inlay-hints = false

[editor.soft-wrap]
enable = false
