# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  nerdFontsVersion: "3"
  showBranchCommitHash: true
  showDivergenceFromBaseBranch: arrowAndNumber
  sidePanelWidth: 0.25
  scrollHeight: 5
  theme:
    activeBorderColor: ["#7aa2f7", bold]
    inactiveBorderColor: ["#3b4261"]
    optionsTextColor: ["#bb9af7"]
    selectedLineBgColor: ["#2e3c64"]
    cherryPickedCommitBgColor: ["#3b4261"]
    cherryPickedCommitFgColor: ["#7dcfff"]
    unstagedChangesColor: ["#f7768e"]
    defaultFgColor: ["#c0caf5"]
    searchingActiveBorderColor: ["#e0af68", bold]

git:
  overrideGpg: true
  diffRenderers:
    - name: delta
      command: delta --paging=never
      colorArg: always
    - name: delta side-by-side
      command: delta --paging=never --side-by-side
      colorArg: always

os:
  editPreset: helix

update:
  method: never
