[tools]
# General text
"cargo:typos-lsp" = "latest"

# Bash / Zsh
"npm:bash-language-server" = "latest"
shfmt = "latest"
shellcheck = "latest"

# Python
ruff = "latest"
ty = "latest"

# JavaScript / TypeScript
"npm:@vtsls/language-server" = "latest"
biome = "latest"

# Go
"go:golang.org/x/tools/gopls" = "latest"
golangci-lint = "latest"
golangci-lint-langserver = "latest"

# SQL
"cargo:sqruff" = "latest"

# TOML
tombi = "latest"

# YAML
"npm:yaml-language-server" = "latest"
yamlfmt = "latest"
yamllint = "latest"

# KDL
"cargo:kdl-lsp" = "latest"
"cargo:kdlfmt" = "latest"

# JSON / HTML / CSS
"npm:vscode-langservers-extracted" = "latest"

# Markdown
rumdl = "latest"

# Docker
"go:github.com/docker/docker-language-server/cmd/docker-language-server" = "latest"
"go:github.com/reteps/dockerfmt" = "latest"
hadolint = "latest"

# Justfile
"cargo:just-lsp" = "latest"
