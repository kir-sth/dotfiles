[tools]
bun = "latest"
go = "latest"
python = "latest"
uv = "latest"
rust = "latest"
cargo-binstall = "latest"

"cargo:sccache" = { version = "latest" }
"cargo:ghgrab" = { version = "latest" }
"pipx:sqlit-tui" = { version = "latest", extras = ["ssh"] }

[settings]
cargo.binstall = true
experimental = true
minimum_release_age = "3d"
npm.package_manager = "bun"
pipx.uvx = true
python.uv_venv_auto = "source"
status.show_tools = true
idiomatic_version_file_enable_tools = ["rust", "python", "bun", "go"]

[env]
PIP_REQUIRE_VIRTUALENV = "true"
RUSTC_WRAPPER = "sccache"
UV_PYTHON_PREFERENCE = "only-managed"
