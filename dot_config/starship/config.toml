"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1_000

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$bun\
$python\
$golang\
$rust\
$docker_context\
$container\
$jobs\
$cmd_duration\
$status\
$line_break\
$character"""

# SSH / Host

[os]
disabled = false
style = "bold #bb9af7"
format = "[$symbol]($style)"

[username]
show_always = false
style_user = "bold #9ece6a"
style_root = "bold #f7768e"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold #7dcfff"
format = "[@$hostname]($style) "

# Directory

[directory]
style = "bold #7dcfff"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = "󰌾 "
read_only_style = "bold #f7768e"

# Git

[git_branch]
style = "bold #bb9af7"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 20
truncation_symbol = "…"

[git_status]
style = "#f7768e"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "\\$"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "bold #9ece6a"
deleted_style = "bold #f7768e"
format = "([+$added]($added_style))([-$deleted]($deleted_style) )"

# Languages

[bun]
style = "bold #9ece6a"
format = "[$symbol$version]($style) "

[python]
style = "bold #e0af68"
format = "[$symbol($version )($virtualenv )]($style)"

[golang]
style = "bold #73daca"
format = "[$symbol$version]($style) "

[rust]
style = "bold #ff9e64"
format = "[$symbol$version]($style) "

# Infrastructure

[docker_context]
style = "bold #7dcfff"
format = "[$symbol$context]($style) "
only_with_files = true

[container]
style = "#ff9e64"
format = "[$symbol$name]($style) "

# Status

[jobs]
symbol = "⚙ "
style = "bold #ff9e64"
format = "[$symbol$number]($style) "
threshold = 1

[cmd_duration]
min_time = 2_000
style = "#e0af68"
format = "[⏱ $duration]($style) "

[status]
disabled = false
style = "bold #f7768e"
symbol = "✘ "
success_symbol = ""
format = "[$symbol$status]($style) "

# Prompt

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[✖](bold #f7768e)"
vicmd_symbol = "[❮](bold #bb9af7)"
