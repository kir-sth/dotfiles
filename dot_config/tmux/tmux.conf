# GENERAL
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on
set -g display-time 4000
set -g default-shell $SHELL

# PREFIX
set -g prefix2 C-Space
bind C-Space send-prefix -2
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# WINDOWS & PANES
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind -n S-Left  previous-window
bind -n S-Right next-window

# VI MODE
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# STATUS BAR
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-left-length 20
set -g status-right "#[fg=#a9b1d6] %H:%M #[fg=#7aa2f7,bold]#{host} "
set -g status-right-length 40
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#2a2b3d"
set -g pane-active-border-style "fg=#7aa2f7"
