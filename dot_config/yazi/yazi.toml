[mgr]
ratio = [1, 2, 3]
sort_by = "natural"
sort_reverse = false
show_hidden = true
show_symlink = true

[opener]
edit = [
  { run = "$EDITOR %s", block = true, desc = "editor" },
]
zed = [
  { run = "zed %s", orphan = true, desc = "zed" },
]
open = [
  { run = "open %s", desc = "macOS open" },
]
extract = [
  { run = "ouch d -y %s", desc = "Extract here with ouch" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = ["edit", "zed"] },
  { mime = "application/json", use = ["edit", "zed"] },
  { mime = "inode/empty", use = ["edit", "zed"] },
  { mime = "image/*", use = ["open"] },
  { mime = "video/*", use = ["open"] },
  { mime = "audio/*", use = ["open"] },
  { mime = "application/pdf", use = ["open"] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal"
  ] },
  { mime = "*", use = ["open"] },
]

[plugin]
prepend_previewers = [
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --show-file-icons" },
]
